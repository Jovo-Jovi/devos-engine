<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DEV_OS setup</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plex-serif-300.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#stage">Skip to the current step</a>
<div class="shell">
  <header class="bar">
    <div class="mark">
      <svg class="mark-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path class="mark-wash" d="M6 4 L20 12 L6 20 Z"></path>
        <path d="M6 4 L20 12 L6 20 Z"></path>
      </svg>
      <span class="mark-name">DEV_OS</span>
    </div>
    <p class="where" id="where">Setting up a new project</p>
    <div class="bar-actions">
      <button class="btn btn-quiet" id="stop" type="button" hidden>Stop run</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Setup steps"></nav>
  <main class="stage" id="stage" tabindex="-1">
    <div class="boot" id="boot">
      <svg class="boot-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path class="mark-wash" d="M6 4 L20 12 L6 20 Z"></path>
        <path d="M6 4 L20 12 L6 20 Z"></path>
      </svg>
      <h1 class="boot-title">Checking this computer</h1>
      <p class="boot-lede">The engine is looking for your AI tools and checking the folder. This takes a few seconds.</p>
    </div>
  </main>
</div>
<noscript><p class="noscript">This page needs JavaScript. You can also run <code>devos init</code> in a terminal.</p></noscript>
</body>
</html>
