# Dev OS supervisor: keeps the automation moving without the owner having to diagnose it.
#
# Runs when a Dev OS workflow finishes, every 30 minutes, when you run it by hand, and when you reply
# `/devos approve <id>` or `/devos reject <id>` on the "Dev OS: supervisor" issue. It:
#   - spots what has stopped: a failed cycle run, a halted or overdue parked task, a rescue branch,
#     or nothing running although the next task is waiting;
#   - explains it with fixed rules first, and asks Claude Code (read-only) only when no rule fits and Claude Code is
#     the project's reviewer agent (PR-53);
#   - fixes what is safe on its own (re-run, resume, continue from the branch, recover a rescue
#     branch, start the next task), at most supervisor.max_auto_per_key times for the same cause;
#   - turns everything else into something you approve: a method-fix issue, a change request, a
#     proposed revision (`/devos approve <id>`), or the exact setup steps only you can do;
#   - reports each incident as one comment on the "Dev OS: supervisor" issue.
# It never merges, never pushes to main, never handles a secret value. Off switch: repository
# variable DEVOS_SUPERVISOR=off (DEVOS_PAUSED=true stops it too).
# PR-94: your DEVOS_PAT reaches only the two steps that act; Claude Code diagnoses as the review's own user (no shell,
# no secret file, scrubbed after), and any issue or `/devos revise` it would post waits for your approval.
name: devos-supervisor

on:
  workflow_run:
    workflows: [devos-cycle, devos-intake, devos-deploy, devos-resume, devos-wait, devos-advance, ci]
    types: [completed]
  schedule:
    - cron: "11,41 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what it would do"
        type: boolean
        default: false

concurrency:
  group: devos-supervisor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  # PR-70: the annotation that says a cycle run passed its time limit.
  checks: read
  issues: write
  pull-requests: read

jobs:
  supervise:
    if: >-
      vars.DEVOS_SUPERVISOR != 'off' && vars.DEVOS_PAUSED != 'true' &&
      (github.event_name != 'workflow_run' || !contains(fromJSON('["skipped","cancelled"]'), github.event.workflow_run.conclusion)) && (
        github.event_name != 'issue_comment' || (
          !github.event.issue.pull_request &&
          contains(github.event.issue.labels.*.name, 'devos:supervisor') &&
          (startsWith(github.event.comment.body, '/devos approve') || startsWith(github.event.comment.body, '/devos reject')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      # PR-63: a role's model from a repository variable (same tool); unset = the configured model.
      DEVOS_REVIEWER_MODEL: ${{ vars.DEVOS_REVIEWER_MODEL }}
      DEVOS_REVIEWER_LIGHT_MODEL: ${{ vars.DEVOS_REVIEWER_LIGHT_MODEL }}
      DEVOS_BUILDER_MODEL: ${{ vars.DEVOS_BUILDER_MODEL }}
      # PR-94: reads and reports use the built-in token, whose comments start no workflow (no self-trigger loop). Your
      # DEVOS_PAT is OWNER_TOKEN in the two steps that act, never at the job's level.
      GH_TOKEN: ${{ github.token }}
      REPORT_TOKEN: ${{ github.token }}
      EVENT_NAME: ${{ github.event_name }}
      # workflow_run.name is the run's title ("devos T05 · attempt 4"); the file names the workflow.
      WF_NAME: ${{ github.event.workflow_run.name }}
      WF_PATH: ${{ github.event.workflow_run.path }}
      WF_RUN_ID: ${{ github.event.workflow_run.id }}
      WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Approve or reject a proposal
        if: github.event_name == 'issue_comment'
        env:
          BODY: ${{ github.event.comment.body }}
          OWNER_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
        run: node scripts/devos/supervisor.mjs approve --body "$BODY"

      - name: Scan — what has stopped, and why (fixed rules)
        id: scan
        if: github.event_name != 'issue_comment'
        run: node scripts/devos/supervisor.mjs scan $DRY

      # Only for what no rule explains, and only when Claude Code is the project's reviewer agent (PR-53): it reads the
      # facts, the logs and the repository, read-only, on the model the developer chose.
      # PR-94: as the review's own user (review-user.sh, PR-90), in a copy of main with the facts: no shell, no hooks, no
      # MCP server, nothing to read outside that copy, and only its own credential in its environment. Its answer is
      # scrubbed of every secret value this step holds before anything reads it.
      - name: Diagnose — Claude Code (read-only, its own user)
        if: steps.scan.outputs.ask_claude == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ""
          REPORT_TOKEN: ""
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY_2 }}
          DEVOS_SCRIPTS: ${{ github.workspace }}/scripts/devos
          DEVOS_REVIEW_PASS: CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY
          RW: /opt/devos-review-work
        run: |
          # PR-53: the second opinion runs only when the project's reviewer agent is Claude Code, on the model the developer chose.
          line=$(node scripts/devos/agents.mjs reviewer --mode deep 2>/dev/null || true)
          tool=$(printf '%s\n' "$line" | sed -n 's/^reviewer_tool=//p')
          if [ -n "$line" ] && [ "$tool" != "claude" ]; then echo "The project's reviewer agent is $tool; no Claude Code second opinion (PR-53)."; exit 0; fi
          chosen=$(printf '%s\n' "$line" | sed -n 's/^reviewer_model=//p')
          [ -n "$OAUTH" ] && export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH"
          [ -n "$APIKEY" ] && export ANTHROPIC_API_KEY="$APIKEY"
          [ -n "$OAUTH$APIKEY" ] || { echo "No Claude credential; the supervisor reports without a diagnosis."; exit 0; }
          MODEL=${chosen:-$(node -e 'const c=require("./devos.config.json");console.log(c.supervisor?.model||c.reviewer.gate_model)')}
          prompt=$(cat devos/prompts/supervisor.md)
          schema=$(cat devos/schemas/supervisor.schema.json)
          # The user (with Claude Code at main's pin), then main's files and the facts in its workspace.
          bash scripts/devos/review-user.sh setup
          tar --exclude=./.git -cf - . | tar -xf - -C "$RW"
          find "$RW" -type l -delete
          bash scripts/devos/review-user.sh workspace
          rc=0
          bash scripts/devos/review-user.sh run "$RW" -- claude -p "$prompt" --model "$MODEL" --effort high --output-format json \
            --json-schema "$schema" --permission-mode dontAsk --max-turns 25 \
            --setting-sources user --settings /opt/devos-tools/settings.json --strict-mcp-config \
            --allowedTools "Read,Glob,Grep" --disallowedTools "Bash,Write,Edit,WebFetch,WebSearch" \
            > .devos/supervisor/claude.json 2> .devos/supervisor/claude.err || rc=$?
          bash scripts/devos/review-user.sh stop
          node scripts/devos/scrub.mjs --names OAUTH,APIKEY,CLAUDE_CODE_OAUTH_TOKEN,ANTHROPIC_API_KEY .devos/supervisor/claude.json .devos/supervisor/claude.err
          if [ "$rc" != "0" ]; then echo "Claude Code exited $rc"; tail -c 1500 .devos/supervisor/claude.err; fi
          # PR-52: nothing here is committed, so this run's usage goes on its summary page only.
          node scripts/devos/usage.mjs record --stage supervisor --command claude --model "$MODEL" --out .devos/supervisor/claude.json --summary || true

      - name: Act and report
        if: github.event_name != 'issue_comment' && steps.scan.outputs.incidents != '0'
        env:
          OWNER_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
        run: node scripts/devos/supervisor.mjs act $DRY --claude .devos/supervisor/claude.json

      # D9: what the supervisor found and did; never the model's own output (claude.json, claude.err).
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devos-supervisor-${{ github.run_id }}
          path: |
            .devos/supervisor/
            !.devos/supervisor/claude.json
            !.devos/supervisor/claude.err
          include-hidden-files: true
          if-no-files-found: ignore
