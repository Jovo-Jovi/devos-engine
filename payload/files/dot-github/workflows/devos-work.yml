# Dev OS cycle — the work job (PR-90). Called by devos-cycle.yml only; it never runs on its own.
#
# Untrusted by design: the builder agent and the project's own code (installs, checks, screenshots) run here, so this
# job holds no GitHub write token, no DEVOS_PAT and no production credential. Its token can only read the repository.
# GitHub sends a job every secret the job names, and a step can read the runner's memory with sudo, so this workflow
# names only the secrets the caller passes in: the builder tool's own keys (KEY_1, KEY_2 and, for Claude, the API keys
# ALT_1, ALT_2) and the media key. Everything it produces is evidence: the publish job of devos-cycle.yml verifies the
# bundle, recomputes every decision from main, runs the one review, and pushes.
#
#   checkout of main at the run's commit → the task branch, main merged in (PR-03, PR-14) → the builder (accounts,
#   time slices, stages: PR-29, PR-38, PR-64) → the checks, screenshots, UI evidence and readiness against the local
#   build (PR-08, PR-51, PR-88) → the evidence pack (PR-22) → one artifact: devos-<task>-a<attempt>-work, holding
#   branch.bundle (one ref, task/<task>) and the evidence, with no raw agent stream (D9).
name: devos-work

on:
  workflow_call:
    inputs:
      task: { type: string, required: true }
      name: { type: string, required: false, default: "" }
      risk: { type: string, required: true }
      attempt: { type: string, required: true }
      branch: { type: string, required: true }
      method: { type: string, required: false, default: "false" }
      # PR-91: the base the task branch starts from and merges: main for a method fix, else the task's unit branch;
      # main_sha is the base's commit at the run's start (the unit's head, or main's for a new unit).
      main_sha: { type: string, required: true }
      base: { type: string, required: false, default: main }
      review_only: { type: boolean, required: false, default: false }
      effort: { type: string, required: false, default: fence }
      fast: { type: string, required: false, default: fence }
      cursor_account: { type: string, required: false, default: "1" }
      claude_account: { type: string, required: false, default: "1" }
      builder_tool: { type: string, required: false, default: cursor }
      builder_id: { type: string, required: false, default: "" }
      builder_model: { type: string, required: false, default: "" }
      builder_fallbacks: { type: string, required: false, default: "" }
      builder_note: { type: string, required: false, default: "" }
    secrets:
      KEY_1: { required: false }
      KEY_2: { required: false }
      ALT_1: { required: false }
      ALT_2: { required: false }
      MEDIA_KEY: { required: false }
    outputs:
      state: { value: "${{ jobs.work.outputs.state }}" }
      not_before: { value: "${{ jobs.work.outputs.not_before }}" }
      exit: { value: "${{ jobs.work.outputs.exit }}" }
      model: { value: "${{ jobs.work.outputs.model }}" }
      effort: { value: "${{ jobs.work.outputs.effort }}" }
      fast: { value: "${{ jobs.work.outputs.fast }}" }
      account: { value: "${{ jobs.work.outputs.account }}" }
      packed: { value: "${{ jobs.work.outputs.packed }}" }

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      state: ${{ steps.bs.outputs.state }}
      not_before: ${{ steps.bs.outputs.not_before }}
      exit: ${{ steps.builder.outputs.exit }}
      model: ${{ steps.builder.outputs.model || steps.bm.outputs.model }}
      effort: ${{ steps.bm.outputs.effort }}
      fast: ${{ steps.bm.outputs.fast }}
      account: ${{ steps.builder.outputs.account }}
      packed: ${{ steps.pack.outputs.packed }}
    env:
      DEVOS_AUTOMATED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TASK: ${{ inputs.task }}
      NAME: ${{ inputs.name }}
      RISK: ${{ inputs.risk }}
      ATTEMPT: ${{ inputs.attempt }}
      BR: ${{ inputs.branch }}
      MAIN_SHA: ${{ inputs.main_sha }}
      DEVOS_BASE: ${{ inputs.base }}
      REVIEW_ONLY: ${{ inputs.review_only && 'true' || 'false' }}
      METHOD: ${{ inputs.method }}
      DEVOS_BUILDER_TOOL: ${{ inputs.builder_tool }}
      # PR-29: which account each agent starts with, and whether it switches on a usage limit.
      DEVOS_CURSOR_ACCOUNT: ${{ inputs.cursor_account }}
      DEVOS_CLAUDE_ACCOUNT: ${{ inputs.claude_account }}
      DEVOS_CODEX_ACCOUNT: ${{ vars.DEVOS_CODEX_ACCOUNT || '1' }}
      DEVOS_GEMINI_ACCOUNT: ${{ vars.DEVOS_GEMINI_ACCOUNT || '1' }}
      DEVOS_ACCOUNT_SWITCH: ${{ vars.DEVOS_ACCOUNT_SWITCH || 'auto' }}
      DEVOS_BUILDER_MODEL: ${{ vars.DEVOS_BUILDER_MODEL }}
    steps:
      # The base at the commit this run started from (main's, the same one publish checks out, or the unit's head, PR-91);
      # the token is read-only and is not kept (PR-04).
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # PR-93: each tool at the exact version main's devos.config.json pins (scripts/devos/pins.mjs); Cursor's agent
      # package by its version and the SHA-256 checked before it is unpacked.
      - name: Install pnpm and the builder's CLI
        id: pins
        run: |
          spec=$(node scripts/devos/pins.mjs pnpm)
          npm install -g "$spec"
          # firebase-tools is installed after the task branch is checked out: its pin is read here, from main.
          spec=$(node scripts/devos/pins.mjs firebase)
          echo "firebase=$spec" >> "$GITHUB_OUTPUT"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # PR-53: only the builder's own CLI; the review runs in publish.
          if [ "$REVIEW_ONLY" != "true" ]; then
            case "$DEVOS_BUILDER_TOOL" in
              claude|codex|gemini)
                spec=$(node scripts/devos/pins.mjs "$DEVOS_BUILDER_TOOL")
                npm install -g "$spec" ;;
              cursor)
                spec=$(node scripts/devos/pins.mjs cursor)
                version=${spec% *}
                pkg="$RUNNER_TEMP/cursor-agent.tar.gz"
                curl -fsSL --retry 3 --retry-delay 2 -o "$pkg" "https://downloads.cursor.com/lab/$version/linux/x64/agent-cli-package.tar.gz"
                echo "${spec#* }  $pkg" | sha256sum -c -
                dir="$HOME/.local/share/cursor-agent/versions/$version"
                mkdir -p "$dir" "$HOME/.local/bin"
                tar --strip-components=1 -xzf "$pkg" -C "$dir"
                ln -sf "$dir/cursor-agent" "$HOME/.local/bin/agent"
                ln -sf "$dir/cursor-agent" "$HOME/.local/bin/cursor-agent" ;;
            esac
          fi

      - name: Stack toolchain (PR-48)
        id: tc
        run: echo "toolchain=$(node -p "require('./devos.config.json').stack?.toolchain || 'node'")" >> "$GITHUB_OUTPUT"

      - name: Python and uv (Python stacks, PR-48)
        if: steps.tc.outputs.toolchain == 'python'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Go (Go stacks, PR-48)
        if: steps.tc.outputs.toolchain == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Flutter (Dart stacks, PR-48)
        if: steps.tc.outputs.toolchain == 'dart'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Supabase CLI (backend module, PR-17)
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          # Pinned (PR-33): "latest" asks GitHub's API, which rate-limits shared runners.
          version: ${{ vars.DEVOS_SUPABASE_CLI_VERSION || '2.120.0' }}

      - name: Check out the task branch (a reissue continues the same branch, PR-03)
        run: |
          git config user.name "devos-runner"
          git config user.email "devos-runner@users.noreply.github.com"
          # PR-91: the scripts compare with origin/<base>; a new unit's branch is made by publish, so it points here.
          git update-ref "refs/remotes/origin/$DEVOS_BASE" "$MAIN_SHA"
          if git rev-parse --verify --quiet "origin/$BR" >/dev/null; then
            git checkout -B "$BR" "origin/$BR"
            echo "REMOTE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            # The base at this run's start, merged first: publish computes the same merge and compares with it (PR-90).
            git merge-base --is-ancestor "$MAIN_SHA" HEAD || git merge --no-edit "$MAIN_SHA"
          elif [ "$REVIEW_ONLY" = "true" ]; then
            echo "::error::review_only needs an existing branch $BR"; exit 1
          else
            git checkout -b "$BR" "$MAIN_SHA"
          fi
          test -f "docs/fences/$TASK.md" || { echo "::error::docs/fences/$TASK.md does not exist: the reviewer has not issued this fence"; exit 1; }
          mkdir -p .devos/logs
          cp devos/ci/mcp.ci.json .cursor/mcp.json
          if [ -f package.json ]; then
            # Visible progress and a hard limit, so a slow registry never looks like a frozen step.
            if ! timeout 600 pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee .devos/logs/install-before.log | grep -E "Progress|Done in|ERR" | tail -n 20; then
              echo "::warning::pnpm install (before build) failed or took over 10 minutes; the builder will see it"
            fi
          fi
          if ! node scripts/devos/run-checks.mjs --install-only > .devos/logs/install-stack.log 2>&1; then
            echo "::warning::the stack's install failed; the builder will see it"
          fi

      - name: Resolve the builder model (fence effort/fast, checked against `agent models`)
        id: bm
        if: env.REVIEW_ONLY != 'true'
        env:
          CURSOR_KEY_1: ${{ inputs.builder_tool == 'cursor' && secrets.KEY_1 || '' }}
          CURSOR_KEY_2: ${{ inputs.builder_tool == 'cursor' && secrets.KEY_2 || '' }}
          POOL_MODEL: ${{ inputs.builder_model }}
          BUILDER_NOTE: ${{ inputs.builder_note }}
          EFFORT_IN: ${{ inputs.effort }}
          FAST_IN: ${{ inputs.fast }}
        run: |
          if [ -n "$BUILDER_NOTE" ]; then echo "$BUILDER_NOTE"; fi
          if [ "$DEVOS_BUILDER_TOOL" != "cursor" ]; then
            node --input-type=module - >> "$GITHUB_OUTPUT" <<'EOF'
          import { existsSync, readFileSync } from "node:fs";
          import { parsePhases } from "./scripts/devos/lib.mjs";
          const task = process.env.TASK;
          const cfg = JSON.parse(readFileSync("devos.config.json", "utf8"));
          let risk = 2;
          try {
            const row = parsePhases().rows.find((item) => item.task === task);
            if (row) risk = row.risk;
          } catch { /* a missing table uses the risk default */ }
          const fence = existsSync(`docs/fences/${task}.md`) ? readFileSync(`docs/fences/${task}.md`, "utf8").split(/\r?\n/).slice(0, 30).join("\n") : "";
          const raw = (/Effort:\s*([A-Za-z -]+?)(?:\s*[·|,]|\s*$|\s*\()/m.exec(fence)?.[1] || "").toLowerCase().replace(/[\s_-]+/g, "");
          let effort = raw === "extrahigh" || raw === "xhigh" ? "xhigh" : ["low", "medium", "high", "xhigh"].includes(raw) ? raw : "";
          const input = (process.env.EFFORT_IN || "").toLowerCase();
          if (["low", "medium", "high", "xhigh"].includes(input)) effort = input;
          if (!effort) effort = cfg.builder?.effort_by_risk?.[String(risk)] ?? cfg.builder?.default_effort ?? "high";
          process.stdout.write(`model=${process.env.POOL_MODEL}\neffort=${effort}\nfast=no\nsource=pool\nnote=\n`);
          EOF
          else
            export DEVOS_BUILDER_FAMILY="$POOL_MODEL"
            . scripts/devos/accounts.sh
            first=$(devos_accounts cursor | cut -d' ' -f1)
            if [ -n "$first" ]; then devos_use_cursor "$first"; agent models > .devos/models.txt 2>&1 || true; fi
            node scripts/devos/builder-model.mjs --task "$TASK" --effort "${EFFORT_IN:-fence}" --fast "${FAST_IN:-fence}"
          fi

      - name: Firebase CLI and Java 21 (Firebase module, PR-26)
        timeout-minutes: 8
        env:
          PINNED_FIREBASE: ${{ steps.pins.outputs.firebase }}
        run: |
          # Installed when the tree has firebase.json or this task's fence introduces the module.
          need=$(node --input-type=module -e 'import { neededModules } from "./scripts/devos/modules.mjs"; console.log(neededModules(process.env.TASK).join(" "))')
          echo "modules for $TASK: ${need:-none}"
          case " $need " in
            *" firebase "*)
              if [ -n "$JAVA_HOME_21_X64" ]; then
                echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
                echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
              fi
              npm install -g "$PINNED_FIREBASE" > .devos/logs/firebase-tools-install.log 2>&1 || echo "::warning title=Dev OS::firebase-tools did not install; the Firebase checks will report missing"
              firebase --version || true ;;
          esac

      - name: Local module services for the builder (Supabase, storage, Firebase)
        if: env.REVIEW_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/devos/modules.mjs start --task "$TASK"

      # PR-81: the media the fence's `- Media:` line names, made before the builder within DEVOS_MEDIA_BUDGET (unset: 0,
      # an estimate only). Only this step holds the media key; no agent runs here. It is committed with the builder's
      # work, and publish accepts exactly the files the fence names. A failure never stops the task: the screens keep
      # their fallbacks.
      - name: Generated media (PR-81)
        if: env.REVIEW_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          DEVOS_MEDIA_XAI_KEY: ${{ secrets.MEDIA_KEY }}
          DEVOS_MEDIA_BUDGET: ${{ vars.DEVOS_MEDIA_BUDGET }}
        run: |
          node scripts/devos/media.mjs --fence "docs/fences/$TASK.md" || echo "media: not every item was made; their screens keep their fallbacks (.devos/media-report.md)"
          if [ -s .devos/media-files.txt ]; then
            git add --pathspec-from-file=.devos/media-files.txt
            git commit -m "$TASK a$ATTEMPT: media" || true
          fi

      - name: Builder (the project's builder agent)
        id: builder
        if: env.REVIEW_ONLY != 'true'
        timeout-minutes: 80
        env:
          # Only the chosen builder tool's keys reach this job (the caller passes them as KEY_1, KEY_2, ALT_1, ALT_2).
          # The watchdog gives the agent the one credential of the account in use, and nothing else (PR-90).
          CURSOR_KEY_1: ${{ inputs.builder_tool == 'cursor' && secrets.KEY_1 || '' }}
          CURSOR_KEY_2: ${{ inputs.builder_tool == 'cursor' && secrets.KEY_2 || '' }}
          CLAUDE_OAUTH_1: ${{ inputs.builder_tool == 'claude' && secrets.KEY_1 || '' }}
          CLAUDE_APIKEY_1: ${{ inputs.builder_tool == 'claude' && secrets.ALT_1 || '' }}
          CLAUDE_OAUTH_2: ${{ inputs.builder_tool == 'claude' && secrets.KEY_2 || '' }}
          CLAUDE_APIKEY_2: ${{ inputs.builder_tool == 'claude' && secrets.ALT_2 || '' }}
          CODEX_KEY_1: ${{ inputs.builder_tool == 'codex' && secrets.KEY_1 || '' }}
          CODEX_KEY_2: ${{ inputs.builder_tool == 'codex' && secrets.KEY_2 || '' }}
          GEMINI_KEY_1: ${{ inputs.builder_tool == 'gemini' && secrets.KEY_1 || '' }}
          GEMINI_KEY_2: ${{ inputs.builder_tool == 'gemini' && secrets.KEY_2 || '' }}
          MODEL: ${{ steps.bm.outputs.model }}
          # PR-64: the builder's next models (its fallback_models), tried after MODEL on every account.
          FALLBACKS: ${{ inputs.builder_fallbacks }}
          DEVOS_BUILDER_MODEL: ${{ steps.bm.outputs.model }}
          DEVOS_BUILDER_EFFORT: ${{ steps.bm.outputs.effort }}
          DEVOS_BUILDER_FAST: ${{ steps.bm.outputs.fast }}
          MODEL_SOURCE: ${{ steps.bm.outputs.source }}
          MODEL_NOTE: ${{ steps.bm.outputs.note }}
          # PR-52: every builder run (restarts, other accounts, the pool's next agent) is in the usage record. The
          # records stay in .devos/usage/; publish checks them and commits them.
          DEVOS_USAGE_STAGE: builder
        run: |
          . scripts/devos/accounts.sh
          builder_tool="$DEVOS_BUILDER_TOOL"
          if [ "$builder_tool" = "claude" ]; then
            accounts=$(devos_accounts claude)
          elif [ "$builder_tool" = "codex" ] || [ "$builder_tool" = "gemini" ]; then
            accounts=$(devos_accounts "$builder_tool")
          else
            accounts=$(devos_accounts cursor)
          fi
          # Long tasks run in time slices of 72 minutes: a slice that ends while the builder is still
          # changing files is committed and the same attempt continues in a fresh run, up to
          # builder.max_time_slices. The slice number is read back from this attempt's last builder commit.
          export DEVOS_MAX_SLICES=$(node -e 'console.log(require("./devos.config.json").builder.max_time_slices ?? 4)')
          export DEVOS_IDLE_STOP=$(node -e 'console.log(require("./devos.config.json").builder.idle_stop_minutes ?? 30)')
          prev=$(git log -20 --format=%s | grep -m1 "^$TASK a$ATTEMPT: builder " || true)
          DEVOS_SLICE=1
          case "$prev" in *"(time slice "*) DEVOS_SLICE=$(( $(printf '%s' "$prev" | sed -n 's/.*(time slice \([0-9]*\)).*/\1/p') + 1 ));; esac
          export DEVOS_SLICE; echo "slice=$DEVOS_SLICE" >> "$GITHUB_OUTPUT"; echo "max_slices=$DEVOS_MAX_SLICES" >> "$GITHUB_OUTPUT"
          echo "time slice $DEVOS_SLICE of $DEVOS_MAX_SLICES"
          # PR-38: a big fence is split by the reviewer into stages (`- Stages: N`); one builder run builds
          # one stage. The stage is read back from this attempt's last builder commit: "(stage k of N done)"
          # moves on to k+1, "(stage k of N)" (a time slice or a restart) continues stage k.
          DEVOS_STAGES=$(sed -n 's/^- Stages: *\([0-9][0-9]*\).*/\1/p' "docs/fences/$TASK.md" 2>/dev/null | head -1); DEVOS_STAGES=${DEVOS_STAGES:-1}
          DEVOS_STAGE=1
          case "$prev" in
            *"(stage "*" done)"*) DEVOS_STAGE=$(( $(printf '%s' "$prev" | sed -n 's/.*(stage \([0-9]*\) of [0-9]* done).*/\1/p') + 1 ));;
            *"(stage "*) DEVOS_STAGE=$(printf '%s' "$prev" | sed -n 's/.*(stage \([0-9]*\) of [0-9]*).*/\1/p');;
          esac
          [ "$DEVOS_STAGE" -gt "$DEVOS_STAGES" ] && DEVOS_STAGE=$DEVOS_STAGES
          export DEVOS_STAGE DEVOS_STAGES; echo "stage=$DEVOS_STAGE" >> "$GITHUB_OUTPUT"; echo "stages=$DEVOS_STAGES" >> "$GITHUB_OUTPUT"
          [ "$DEVOS_STAGES" -gt 1 ] && echo "stage $DEVOS_STAGE of $DEVOS_STAGES"
          if [ "$builder_tool" = "claude" ]; then
            [ -n "$accounts" ] || { echo "::error::set secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY (and optionally the _2 pair)"; exit 1; }
          elif [ "$builder_tool" = "codex" ]; then
            [ -n "$accounts" ] || { echo "::error::set secret OPENAI_API_KEY (and optionally OPENAI_API_KEY_2)"; exit 1; }
          elif [ "$builder_tool" = "gemini" ]; then
            [ -n "$accounts" ] || { echo "::error::set secret GEMINI_API_KEY (and optionally GEMINI_API_KEY_2)"; exit 1; }
          else
            [ -n "$accounts" ] || { echo "::error::no Cursor key: set secret CURSOR_API_KEY (and optionally CURSOR_API_KEY_2)"; exit 1; }
          fi
          # Every active module's local names and throwaway keys (PR-17, PR-26).
          for f in .devos/*.env; do [ -f "$f" ] && { set -a; . "$f"; set +a; }; done
          echo "builder: $MODEL (effort ${DEVOS_BUILDER_EFFORT}, fast ${DEVOS_BUILDER_FAST}, from $MODEL_SOURCE) $MODEL_NOTE · $builder_tool accounts in order: $accounts${FALLBACKS:+ · then the models $FALLBACKS}"
          node scripts/devos/render-prompt.mjs builder "$TASK" "$ATTEMPT" --out .devos/builder-prompt.md
          if [ "$DEVOS_STAGES" -gt 1 ]; then
            if [ "$DEVOS_STAGE" -lt "$DEVOS_STAGES" ]; then
              printf '\n\n**This fence is built in %s stages, and this run builds Stage %s only** (the `### Stage %s` block of the fence). Earlier stages are done and committed on this branch: verify them, never redo them. Do only Stage %s'"'"'s steps, prove the Done-when items it names, and leave the tree green (typecheck, lint and the tests it touches pass). Do not start the next stage. Finish by appending `## Attempt %s · Stage %s of %s` to `docs/reports/%s.md` with that stage'"'"'s evidence; its first line is `STATUS: DONE` or `STATUS: HALT`.\n' "$DEVOS_STAGES" "$DEVOS_STAGE" "$DEVOS_STAGE" "$DEVOS_STAGE" "$ATTEMPT" "$DEVOS_STAGE" "$DEVOS_STAGES" "$TASK" >> .devos/builder-prompt.md
            else
              printf '\n\n**This fence is built in %s stages, and this run builds the last one, Stage %s.** Earlier stages are done and committed on this branch: verify them, never redo them. Build Stage %s, then run **every** Done-when command of the whole fence and write the full `## Attempt %s` report section as the fence asks.\n' "$DEVOS_STAGES" "$DEVOS_STAGE" "$DEVOS_STAGE" "$ATTEMPT" >> .devos/builder-prompt.md
            fi
          fi
          if [ "$DEVOS_SLICE" -gt 1 ]; then
            printf '\n\n**This is time slice %s of this attempt.** The earlier slice ran out of time while working; everything it did is committed on this branch (`git diff --stat origin/'"$DEVOS_BASE"'...HEAD`, `git log`). Read it, verify it against the fence, and finish only what is still missing or failing. Do not start over, redo or duplicate anything.\n' "$DEVOS_SLICE" >> .devos/builder-prompt.md
          fi
          set +e
          # Heartbeat: Cursor's output goes to a file, so print progress every minute.
          ( t0=$(date +%s); while sleep 60; do
              echo "Cursor is working on $TASK: $(( ($(date +%s) - t0) / 60 )) min, $(git status --porcelain | wc -l) file(s) changed so far"
            done ) &
          hb=$!
          ran_tool="$builder_tool"
          # PR-64: each model on every account, then the next model (accounts.sh devos_slots). A limit moves to the next
          # slot; a model the account cannot use moves on at once; with no slot left the attempt is parked until the
          # earliest reset (builder-status.mjs → quota).
          first_model="$MODEL"; models="$MODEL $FALLBACKS"; lim=""; outcome=""
          if [ "$builder_tool" = "codex" ] || [ "$builder_tool" = "gemini" ]; then
            bash scripts/devos/run-agent.sh builder "$builder_tool" "$MODEL" "$DEVOS_BUILDER_EFFORT" .devos/builder-prompt.md $FALLBACKS || exit 1
            . .devos/builder-run.env
            MODEL="${model:-$MODEL}"
          elif [ "$builder_tool" = "claude" ]; then
            node scripts/devos/role-env.mjs swap claude-builder || exit 1
            trap 'node scripts/devos/role-env.mjs restore || exit 1' EXIT
            EFFORT="$DEVOS_BUILDER_EFFORT"
            used=""; restarted=""; tries=0; T0=$(date +%s)
            for slot in $(devos_slots claude $models); do
              MODEL="${slot%@*}"; acc="${slot##*@}"
              devos_use_claude "$acc"; used="$acc"
              while :; do
                left=$(( 72 - ($(date +%s) - T0) / 60 ))
                DEVOS_STDIN=.devos/builder-prompt.md bash scripts/devos/agent-watchdog.sh "$left" 10 .devos/builder.json .devos/builder.err -- \
                  claude -p --model "$MODEL" --effort "$EFFORT" --output-format stream-json --verbose --permission-mode dontAsk --allowedTools "Read,Glob,Grep,Write,Edit,MultiEdit,Bash,Task,Agent,Skill,mcp__context7" --disallowedTools "Bash(git push *),Bash(git commit *),Bash(git checkout *),Bash(git reset *),Bash(gh *),Bash(curl *),Bash(wget *),Bash(pkill *),Bash(killall *)" --mcp-config devos/ci/mcp.claude.json --max-turns 400
                code=$?
                why=$(devos_restart "$code")
                if [ -n "$why" ] && [ -z "$restarted" ] && [ $(( 72 - ($(date +%s) - T0) / 60 )) -ge 25 ]; then
                  restarted=1; mkdir -p .devos/logs; cp .devos/builder.err .devos/logs/builder-stalled.err
                  devos_note "Builder: the Claude CLI $why; restarted once."
                  printf '\n\n**An earlier run of this attempt %s.** Its partial changes are already in the working tree (`git status`). Verify them against the fence and continue from them; do not redo or duplicate them.\n' "$why" >> .devos/builder-prompt.md
                  continue
                fi
                # PR-87: a temporary server error (a 5xx, a dropped connection, "retriable") runs again in place, three times at most.
                if [ "$code" != "0" ] && pause=$(devos_server_wait "$tries") && [ $(( 72 - ($(date +%s) - T0) / 60 )) -ge 10 ] && devos_server_error .devos/builder.json .devos/builder.err "$code"; then
                  tries=$(( tries + 1 )); mkdir -p .devos/logs; cp .devos/builder.err ".devos/logs/builder-server-$tries.err"
                  devos_note "Builder: the Claude CLI stopped on a temporary server error; trying again in $pause s ($tries of 3)."
                  sleep "$pause"
                  printf '\n\n**An earlier run of this attempt stopped on a temporary server error.** Its partial changes are already in the working tree (`git status`). Verify them against the fence and continue from them; do not redo or duplicate them.\n' >> .devos/builder-prompt.md
                  continue
                fi
                break
              done
              if [ "$code" != "0" ] && devos_limited .devos/builder.json .devos/builder.err "$code"; then
                lim=$(devos_limit_file claude "$acc" "$(devos_model_index "$MODEL" $models)"); outcome=limited
                mkdir -p .devos/limits; cat .devos/builder.json .devos/builder.err > "$lim"
                devos_note "Builder: Claude account $acc reached its usage limit on $MODEL."
                printf '\n\n**This attempt was started on another Claude account or model, which reached its usage limit.** Its partial changes are already in the working tree (`git status`). Verify them against the fence and continue from them; do not redo or duplicate them.\n' >> .devos/builder-prompt.md
                continue
              fi
              if [ "$code" != "0" ] && devos_unavailable .devos/builder.json .devos/builder.err "$code"; then
                outcome=unavailable; devos_note "Builder: Claude account $acc cannot use $MODEL; trying the next model."
                continue
              fi
              outcome=ran
              break
            done
          else
          # PR-29: on a usage limit, the same attempt continues on the other account at once; the
          # partial work stays in the tree and the second run is told to continue from it.
          # The watchdog stops a hung CLI inside this step (72 of its 80 minutes), so the work is always
          # committed and the park/halt comment always posted. A lost connection that makes no progress
          # for 10 minutes is restarted once in place; a second stall parks the task (builder-status).
          used=""; restarted=""; tries=0; T0=$(date +%s)
          for slot in $(devos_slots cursor $models); do
            MODEL="${slot%@*}"; acc="${slot##*@}"
            devos_use_cursor "$acc"; used="$acc"
            while :; do
              left=$(( 72 - ($(date +%s) - T0) / 60 ))
              bash scripts/devos/agent-watchdog.sh "$left" 10 .devos/builder.json .devos/builder.err -- \
                agent -p --force --trust --approve-mcps --model "$MODEL" --output-format stream-json "$(devos_prompt cursor .devos/builder-prompt.md)"
              code=$?
              why=$(devos_restart "$code")
              if [ -n "$why" ] && [ -z "$restarted" ] && [ $(( 72 - ($(date +%s) - T0) / 60 )) -ge 25 ]; then
                restarted=1; mkdir -p .devos/logs; cp .devos/builder.err .devos/logs/builder-stalled.err
                devos_note "Builder: the Cursor CLI $why; restarted once."
                printf '\n\n**An earlier run of this attempt %s.** Its partial changes are already in the working tree (`git status`). Verify them against the fence and continue from them; do not redo or duplicate them.\n' "$why" >> .devos/builder-prompt.md
                continue
              fi
              # PR-87: a temporary server error (a 5xx, a dropped connection, "retriable") runs again in place, three times at most.
              if [ "$code" != "0" ] && pause=$(devos_server_wait "$tries") && [ $(( 72 - ($(date +%s) - T0) / 60 )) -ge 10 ] && devos_server_error .devos/builder.json .devos/builder.err "$code"; then
                tries=$(( tries + 1 )); mkdir -p .devos/logs; cp .devos/builder.err ".devos/logs/builder-server-$tries.err"
                devos_note "Builder: the Cursor CLI stopped on a temporary server error; trying again in $pause s ($tries of 3)."
                sleep "$pause"
                printf '\n\n**An earlier run of this attempt stopped on a temporary server error.** Its partial changes are already in the working tree (`git status`). Verify them against the fence and continue from them; do not redo or duplicate them.\n' >> .devos/builder-prompt.md
                continue
              fi
              break
            done
            if [ "$code" != "0" ] && devos_limited .devos/builder.json .devos/builder.err "$code"; then
              lim=$(devos_limit_file cursor "$acc" "$(devos_model_index "$MODEL" $models)"); outcome=limited
              mkdir -p .devos/limits; cat .devos/builder.json .devos/builder.err > "$lim"
              devos_note "Builder: Cursor account $acc reached its usage limit on $MODEL."
              printf '\n\n**This attempt was started on another Cursor account or model, which reached its usage limit.** Its partial changes are already in the working tree (`git status`). Verify them against the fence and continue from them; do not redo or duplicate them.\n' >> .devos/builder-prompt.md
              continue
            fi
            if [ "$code" != "0" ] && devos_unavailable .devos/builder.json .devos/builder.err "$code"; then
              outcome=unavailable; devos_note "Builder: Cursor account $acc cannot use $MODEL; trying the next model."
              continue
            fi
            outcome=ran
            break
          done
          fi
          devos_settle "$outcome" "$lim" .devos/builder.err
          # PR-53, PR-64: a usage limit moves only to the same tool's other account or next model (above); with none
          # left the attempt is parked until the earliest reset (builder-status.mjs → quota). No other agent is used.
          node scripts/devos/role-env.mjs restore || exit 1; trap - EXIT
          kill "$hb" 2>/dev/null
          if [ "$MODEL" != "$first_model" ]; then devos_note "Builder: switched to $ran_tool $MODEL (account $used)."
          elif [ "$used" != "${accounts%% *}" ]; then devos_note "Builder: switched to $ran_tool account $used."; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "changed=$(git status --porcelain | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "account=$used" >> "$GITHUB_OUTPUT"
          echo "builder exit code: $code ($ran_tool account $used)"
          tail -c 2000 .devos/builder.err || true

      # Advisory: publish decides from main's rules. A builder that changed a file it may not change stops here, before
      # the checks spend their time; publish then rejects the bundle and names the paths.
      - name: Guard — builder surface and method files (advisory; publish decides)
        id: guard
        if: env.REVIEW_ONLY != 'true'
        continue-on-error: true
        run: |
          node scripts/devos/guard-surfaces.mjs builder
          changed=$( { git diff --name-only --no-renames -z HEAD; git ls-files --others --exclude-standard -z; } \
            | grep -zE '^(\.github/|scripts/devos/|scripts/guards/|devos/|devos\.config\.json$|CLAUDE\.md$|\.claude/|\.cursor/(rules|hooks|cli))' | tr '\0' '\n' | sort -u || true)
          if [ -n "$changed" ] && [ "$METHOD" != "true" ]; then
            echo "Method files changed:"; echo "$changed"
            echo "::error title=Dev OS::$TASK is a product task, but the builder changed method files. publish will not push it."
            exit 1
          fi

      - name: Commit the builder's work (here only; publish pushes)
        if: env.REVIEW_ONLY != 'true'
        run: |
          rm -f .cursor/mcp.json
          git add -A
          git commit --allow-empty -q -m "$TASK a$ATTEMPT: builder (work job)"

      - name: Builder outcome (PR-12)
        id: bs
        env:
          BUILDER_ID: ${{ inputs.builder_id }}
          B_EXIT: ${{ steps.builder.outputs.exit }}
          B_SLICE: ${{ steps.builder.outputs.slice || 1 }}
          B_MAX: ${{ steps.builder.outputs.max_slices || 4 }}
          B_CHANGED: ${{ steps.builder.outputs.changed || 0 }}
          B_STAGE: ${{ steps.builder.outputs.stage || 1 }}
          B_STAGES: ${{ steps.builder.outputs.stages || 1 }}
          GUARD: ${{ steps.guard.outcome }}
        run: |
          if [ "$GUARD" = "failure" ]; then
            echo "state=error" >> "$GITHUB_OUTPUT"; echo "the builder changed files it may not change; no checks"; exit 0
          fi
          node scripts/devos/builder-status.mjs --task "$TASK" --attempt "$ATTEMPT" --tool "$DEVOS_BUILDER_TOOL" --builder "$BUILDER_ID" --exit "$B_EXIT" --review-only "$REVIEW_ONLY" --slice "$B_SLICE" --max-slices "$B_MAX" --changed "$B_CHANGED" --stage "$B_STAGE" --stages "$B_STAGES"

      - name: Checks (evidence for the reviewer)
        id: checks
        if: steps.bs.outputs.state == 'ok'
        run: |
          if [ -f package.json ]; then
            timeout 600 pnpm install --frozen-lockfile --reporter=append-only > .devos/logs/install.log 2>&1 || echo "::warning::pnpm install --frozen-lockfile failed or took over 10 minutes"
            tail -n 3 .devos/logs/install.log
          fi
          node scripts/devos/run-checks.mjs

      - name: Screenshots for the reviewer's visual check (the local build)
        if: steps.bs.outputs.state == 'ok'
        continue-on-error: true
        run: |
          if [ -f package.json ] && grep -q '"@playwright/test"' package.json; then
            pnpm exec playwright install --with-deps chromium > .devos/logs/playwright-install.log 2>&1 || true
            node scripts/devos/screens.mjs
          else
            echo "No Playwright in the project; no screenshots."
          fi

      - name: UI evidence and accessibility checks (PR-51)
        # A UI fence's captures become the required checks ui-evidence and a11y; publish requires them from main's rules.
        if: steps.bs.outputs.state == 'ok'
        run: node scripts/devos/ui-evidence.mjs --task "$TASK"

      - name: Production readiness (PR-88)
        # The launch task (a `- Launch:` line) gets the mechanical checks against the local build: headers, the audit,
        # accessibility and page speed become the required check readiness, so a red check overrides PASS.
        if: steps.bs.outputs.state == 'ok' && hashFiles(format('docs/fences/{0}.md', env.TASK)) != ''
        run: |
          if grep -q '^- Launch:' "docs/fences/$TASK.md"; then
            if [ -f package.json ] && grep -q '"@playwright/test"' package.json && [ ! -f .devos/logs/playwright-install.log ]; then
              pnpm exec playwright install --with-deps chromium > .devos/logs/playwright-install.log 2>&1 || true
            fi
            node scripts/devos/readiness.mjs --task "$TASK"
          else
            echo "readiness: N/A ($TASK has no - Launch: line)"
          fi

      - name: Evidence pack (PR-22)
        if: steps.bs.outputs.state == 'ok'
        run: |
          for f in .devos/*.env; do [ -f "$f" ] && { set -a; . "$f"; set +a; }; done
          node scripts/devos/evidence.mjs --task "$TASK" --attempt "$ATTEMPT"
          sed -n '1,12p' .devos/evidence.md

      # One bundle with one ref (the task branch's new commits only) and the evidence. No raw agent stream (D9), no
      # *.env file (a module's local service names and keys), no screenshot (their own artifact, PR-67).
      - name: Pack the bundle and the evidence
        id: pack
        if: always()
        run: |
          out="$RUNNER_TEMP/devos-out"
          rm -rf "$out"; mkdir -p "$out/evidence"
          if git rev-parse --verify --quiet "refs/heads/$BR" >/dev/null; then
            excl=("^$MAIN_SHA"); [ -n "${REMOTE_HEAD:-}" ] && excl+=("^$REMOTE_HEAD")
            if [ "$(git rev-list --count "refs/heads/$BR" "${excl[@]}")" != "0" ]; then
              git bundle create "$out/branch.bundle" "refs/heads/$BR" "${excl[@]}"
            fi
          fi
          if [ -d .devos ]; then
            ( cd .devos && find . -type f \
                ! -name '*.env' ! -name '*.png' ! -name 'builder.json*' ! -name 'builder.err' ! -name 'reviewer.json*' \
                ! -name 'reviewer.err' ! -name '*.stream.jsonl' ! -name '*.agent-pid' ! -name 'builder-last-action' ! -name 'builder-timeline.json' \
                ! -path './limits/*' ! -path './logs/builder-*' \
                -size -20M -print0 | xargs -0 -r cp --parents -t "$out/evidence" )
          fi
          ls -la "$out"
          echo "packed=true" >> "$GITHUB_OUTPUT"
      - name: Keep the work job's output
        if: always() && steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: devos-${{ inputs.task }}-a${{ inputs.attempt }}-work
          path: ${{ runner.temp }}/devos-out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      # PR-67: the screenshots are most of a run's storage and matter only while the attempt is reviewed, so they are an
      # artifact of their own, kept DEVOS_SCREENS_RETENTION_DAYS days (3 when unset).
      - name: Keep the screenshots (PR-67)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: devos-${{ inputs.task }}-a${{ inputs.attempt }}-screens
          path: .devos/screens/**/*.png
          include-hidden-files: true
          retention-days: ${{ vars.DEVOS_SCREENS_RETENTION_DAYS || 3 }}
          if-no-files-found: ignore
